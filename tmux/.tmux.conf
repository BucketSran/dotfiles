# ===== 基础体验 =====
set -g mouse on                 # 鼠标可点击切 pane / 滚动 / 调整大小
set -s escape-time 0            # 去掉 ESC 延迟（vim/helix 用户必改，否则按 ESC 有卡顿）
set -g history-limit 50000      # 回滚缓冲区从默认 2000 行加大
set -g base-index 1             # 窗口编号从 1 开始（0 在键盘太远了）
setw -g pane-base-index 1       # pane 编号同样从 1 开始
set -g renumber-windows on      # 关掉窗口后自动重排编号，不留空洞
set -sg exit-empty on           # 最后一个窗口关掉时自动结束会话
set -g detach-on-destroy off    # 关掉会话回到会话列表，而不是脱离 tmux

# ===== 分屏：| 左右分，- 上下分（形状直觉化，替代 % 和 "）=====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新窗口也继承当前路径
bind c new-window -c "#{pane_current_path}"

# ===== 重载配置 =====
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# ===== 状态栏：放顶部，极简 =====
set -g status-position top
set -g status-left "#[fg=green]#S "          # 会话名
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M"
setw -g window-status-current-format "#[fg=black,bg=green] #I:#W "
setw -g window-status-format "#[fg=white] #I:#W "
